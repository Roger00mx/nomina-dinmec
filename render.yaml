# Configuración automática para Render.com (https://render.com)
# Con este archivo, Render crea el servicio y el disco persistente solos.
services:
  - type: web
    name: nomina-dinmec
    runtime: node
    plan: starter            # plan con disco persistente (~$7 USD/mes)
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: DIR_DATOS
        value: /datos         # los datos de nómina viven aquí y NO se borran
      - key: NODE_VERSION
        value: "24"
    disk:
      name: datos-nomina
      mountPath: /datos
      sizeGB: 1               # la nómina son puros datos de texto: 1 GB sobra
